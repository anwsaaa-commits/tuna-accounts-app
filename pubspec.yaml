name: tuna_sales_ledger
description: تطبيق حسابات بيع التونة بالكيلو وإدارة العملاء والفواتير والتحصيل والتقارير.
publish_to: 'none'
version: 1.1.3+25

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.3
  pdf: ^3.11.1
  printing: ^5.13.3
  file_picker: ^8.1.2
  flutter_contacts: ^1.1.9+2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#080A0F"
  adaptive_icon_foreground: "assets/app_icon.png"
