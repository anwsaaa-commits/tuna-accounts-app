name: Validate Tuna Plus Source
on:
  push:
    branches:
      - tuna-plus-1.1.3-fixes
      - tuna-plus-1.1.4-fixes
      - tuna-plus-1.1.6-fixes
      - tuna-plus-1.1.7-pdf-fix
      - tuna-plus-1.1.8-pdf-render-fix
      - tuna-plus-1.1.9-pdf-text-guard
      - tuna-plus-1.1.11-copy-bank-number
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Download Latin fallback font for PDF rendering
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf \
            -o assets/fonts/NotoSans-Regular.ttf
          test -s assets/fonts/NotoSans-Regular.ttf
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter source
        run: flutter analyze --no-fatal-infos
      - name: Run unit and regression tests
        run: flutter test --reporter expanded
