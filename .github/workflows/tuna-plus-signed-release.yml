name: Build Tuna Plus Signed APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.alshaheen.tunaplus --project-name tuna_sales_ledger --no-pub
      - name: Configure permanent Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || (echo "Missing GitHub secret KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing GitHub secret KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing GitHub secret KEY_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing GitHub secret KEY_ALIAS" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/tuna-plus-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=tuna-plus-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          if groovy.exists():
              p = groovy
              s = p.read_text()
              if "keystoreProperties" not in s:
                  s = s.replace("android {", """def keystoreProperties = new java.util.Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))

          android {""", 1)
              if "signingConfigs {" not in s:
                  s = s.replace("    buildTypes {", """    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {""", 1)
              marker = "    buildTypes {"
              i = s.index(marker)
              head, tail = s[:i], s[i:]
              tail = tail.replace("        release {", """        release {
                      signingConfig signingConfigs.release""", 1)
              p.write_text(head + tail)
          elif kotlin.exists():
              p = kotlin
              s = p.read_text()
              if "keystoreProperties" not in s:
                  s = s.replace("android {", """import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(FileInputStream(keystorePropertiesFile))

          android {""", 1)
              if 'create("release")' not in s:
                  s = s.replace("    buildTypes {", """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
              buildTypes {""", 1)
              marker = "    buildTypes {"
              i = s.index(marker)
              head, tail = s[:i], s[i:]
              tail = tail.replace('        getByName("release") {', """        getByName("release") {
                      signingConfig = signingConfigs.getByName("release")""", 1)
              p.write_text(head + tail)
          else:
              raise SystemExit("Android app Gradle file not found")
          PY
      - name: Add contacts permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.READ_CONTACTS"/>\\n'
          if "android.permission.READ_CONTACTS" not in s:
              s = s.replace("<application", permission + "    <application", 1)
          p.write_text(s)
          PY
      - name: Verify contacts permission
        run: grep -q 'android.permission.READ_CONTACTS' android/app/src/main/AndroidManifest.xml
      - name: Set app compile SDK 36
        run: |
          FILE=android/app/build.gradle
          if [ -f android/app/build.gradle.kts ]; then FILE=android/app/build.gradle.kts; fi
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' "$FILE"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$FILE"
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$FILE"
          grep -Eq 'compileSdk(Version)?[[:space:]]*(=[[:space:]]*)?36' "$FILE"
      - run: flutter pub get
      - name: Raise cached Flutter plugin compile SDK to 36
        run: |
          find "$HOME/.pub-cache" -path '*/android/build.gradle*' -type f -print0 | xargs -0 -r sed -i -E 's/compileSdk[[:space:]]+flutter\\.compileSdkVersion/compileSdk 36/g; s/compileSdk[[:space:]]*=[[:space:]]*flutter\\.compileSdkVersion/compileSdk = 36/g; s/compileSdkVersion[[:space:]]+flutter\\.compileSdkVersion/compileSdkVersion 36/g; s/compileSdkVersion[[:space:]]+34/compileSdkVersion 36/g; s/compileSdk[[:space:]]+34/compileSdk 36/g; s/compileSdk[[:space:]]*=[[:space:]]*34/compileSdk = 36/g'
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee signing-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tuna-plus-1.1.1-signed-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            signing-certificate.txt
          if-no-files-found: error
