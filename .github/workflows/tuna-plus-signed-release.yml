name: Build Tuna Plus Signed APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.alshaheen.tunaplus --project-name tuna_sales_ledger --no-pub
      - name: Configure permanent Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || (echo "Missing GitHub secret KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing GitHub secret KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing GitHub secret KEY_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing GitHub secret KEY_ALIAS" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/tuna-plus-release.jks
          test -s android/app/tuna-plus-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=tuna-plus-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          def find_block(text, marker, start=0):
              pos = text.find(marker, start)
              if pos < 0:
                  return None
              opening = text.find("{", pos)
              if opening < 0:
                  return None
              depth = 0
              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return pos, opening, i
              return None

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          if groovy.exists():
              p = groovy
              s = p.read_text()
              if "keystoreProperties" not in s:
                  s = s.replace("android {", """def keystoreProperties = new java.util.Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))

          android {""", 1)
              cfg = find_block(s, "signingConfigs {")
              release_cfg = """
              release {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile file(keystoreProperties['storeFile'])
                  storePassword keystoreProperties['storePassword']
              }
          """
              if cfg:
                  s = s[:cfg[2]] + release_cfg + s[cfg[2]:]
              else:
                  s = s.replace("    buildTypes {", "    signingConfigs {\n" + release_cfg + "    }\n    buildTypes {", 1)
              bt = find_block(s, "buildTypes {")
              if not bt:
                  raise SystemExit("Could not find Groovy buildTypes block")
              rel = find_block(s, "release {", bt[1])
              if not rel:
                  raise SystemExit("Could not find Groovy release build type")
              body = s[rel[1]+1:rel[2]]
              body = re.sub(r"(?m)^\s*signingConfig\s+signingConfigs\.debug\s*$", "", body)
              if "signingConfig signingConfigs.release" not in body:
                  body = "\n                      signingConfig signingConfigs.release\n" + body
              s = s[:rel[1]+1] + body + s[rel[2]:]
              p.write_text(s)
          elif kotlin.exists():
              p = kotlin
              s = p.read_text()
              if "keystoreProperties" not in s:
                  s = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + s
                  s = s.replace("android {", """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(FileInputStream(keystorePropertiesFile))

          android {""", 1)
              cfg = find_block(s, "signingConfigs {")
              release_cfg = """
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          """
              if cfg:
                  s = s[:cfg[2]] + release_cfg + s[cfg[2]:]
              else:
                  s = s.replace("    buildTypes {", "    signingConfigs {\n" + release_cfg + "    }\n    buildTypes {", 1)
              bt = find_block(s, "buildTypes {")
              if not bt:
                  raise SystemExit("Could not find Kotlin buildTypes block")
              rel = find_block(s, 'getByName("release") {', bt[1])
              if not rel:
                  rel = find_block(s, 'create("release") {', bt[1])
              if not rel:
                  rel = find_block(s, "release {", bt[1])
              if not rel:
                  raise SystemExit("Could not find Kotlin release build type (release {)")
              body = s[rel[1]+1:rel[2]]
              body = re.sub(r'(?m)^\s*signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)\s*$', "", body)
              if 'signingConfig = signingConfigs.getByName("release")' not in body:
                  body = '\n                      signingConfig = signingConfigs.getByName("release")\n' + body
              s = s[:rel[1]+1] + body + s[rel[2]:]
              p.write_text(s)
          else:
              raise SystemExit("Android app Gradle file not found")
          PY
          grep -q 'key.properties' android/app/build.gradle 2>/dev/null || grep -q 'key.properties' android/app/build.gradle.kts
          grep -q 'tuna-plus-release.jks' android/key.properties
      - name: Verify signing credentials before expensive build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE=android/app/tuna-plus-release.jks
          test -s "$KEYSTORE"
          echo "Checking keystore password and alias..."
          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Checking private-key password..."
          TEMP_KEYSTORE="$(mktemp)"
          cp "$KEYSTORE" "$TEMP_KEYSTORE"
          trap 'rm -f "$TEMP_KEYSTORE"' EXIT
          keytool -keypasswd -alias "$KEY_ALIAS" -keystore "$TEMP_KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -new "Temporary-Validation-Only-9274" >/dev/null
          echo "Signing credentials verified successfully."
      - name: Add contacts permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n'
          if "android.permission.READ_CONTACTS" not in s:
              s = s.replace("<application", permission + "    <application", 1)
          p.write_text(s)
          PY
      - name: Verify contacts permission
        run: grep -q 'android.permission.READ_CONTACTS' android/app/src/main/AndroidManifest.xml
      - name: Set app compile SDK 36
        run: |
          FILE=android/app/build.gradle
          if [ -f android/app/build.gradle.kts ]; then FILE=android/app/build.gradle.kts; fi
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' "$FILE"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$FILE"
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$FILE"
          grep -Eq 'compileSdk(Version)?[[:space:]]*(=[[:space:]]*)?36' "$FILE"
      - run: flutter pub get
      - name: Generate crowned Tuna Plus launcher icon
        run: |
          test -s assets/tuna_plus_crown_icon.png
          dart run flutter_launcher_icons
      - name: Raise cached Flutter plugin compile SDK to 36
        run: |
          find "$HOME/.pub-cache" -path '*/android/build.gradle*' -type f -print0 | xargs -0 -r sed -i -E 's/compileSdk[[:space:]]+flutter\\.compileSdkVersion/compileSdk 36/g; s/compileSdk[[:space:]]*=[[:space:]]*flutter\\.compileSdkVersion/compileSdk = 36/g; s/compileSdkVersion[[:space:]]+flutter\\.compileSdkVersion/compileSdkVersion 36/g; s/compileSdkVersion[[:space:]]+34/compileSdkVersion 36/g; s/compileSdk[[:space:]]+34/compileSdk 36/g; s/compileSdk[[:space:]]*=[[:space:]]*34/compileSdk = 36/g'
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify APK signature matches release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee signing-certificate.txt
          keytool -exportcert -alias "$KEY_ALIAS" -keystore android/app/tuna-plus-release.jks -storepass "$KEYSTORE_PASSWORD" -rfc | openssl x509 -noout -fingerprint -sha256 > keystore-fingerprint.txt
          EXPECTED=$(sed 's/.*=//;s/://g' keystore-fingerprint.txt | tr '[:upper:]' '[:lower:]')
          ACTUAL=$(grep -i 'certificate SHA-256 digest:' signing-certificate.txt | head -1 | sed 's/.*digest: //' | tr '[:upper:]' '[:lower:]')
          test -n "$EXPECTED"
          test -n "$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: APK certificate does not match the release keystore. Refusing to upload."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' signing-certificate.txt; then
            echo "ERROR: APK is signed with Android Debug certificate."
            exit 1
          fi
          echo "Verified: APK signature matches permanent release keystore."
      - uses: actions/upload-artifact@v4
        with:
          name: tuna-plus-1.1.8-signed-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            signing-certificate.txt
          if-no-files-found: error
